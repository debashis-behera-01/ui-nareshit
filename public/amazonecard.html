<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazone</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
    .amz-img{
        background-size: cover;
        background-repeat: no-repeat;
        width: 1520px;
    }  
    .card{
        margin-top: -300px;
        display: grid;
        grid-template-columns: 3fr 3fr 3fr 3fr;
        padding: 10px;
        gap: 40px;
          
    }
    .card-1 ,.card-3{
        border: 2px solid gray;
        height: 600px;
        width: 450px;
        background-color: white;
        border-radius: 5px;
        padding: 10px;
    }
    .card-2{
        border: 2px solid gray;
        height: 600px;
        width: 450px;
        background-color: white;
        border-radius: 5px;
        padding: 10px;
    }
    .b-row-1{
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
    }
    .b-row-2{
        display: flex;
        justify-content: space-around;
        margin-top: 60px;
    }
    .b-row-3{
       display: flex;
        justify-content: space-around;
        margin-top: 10px; 
    }
    .b-row-4{
        display: flex;
        justify-content: space-around;
        margin-top: 10px;  
    }
    .card-footer{
        margin-top: 70px;
        text-align:center;
        font-size: 20px;
        font-weight: bold;
    }
    .card-header{
     padding: 10px;
     border-radius: 2px;
     text-align: center;
    }
    .img-1{
        background-color: rgb(211, 207, 207);
        padding: 10px;
        border-radius: 3px;

    }
    </style>
</head>
<body>
    <div>
        <div class="hero">
            <img class="amz-img" src="../images/amazone banner.jpg">
            </div>
          <div class="card">
              <div class="card-1">
                <div class="card-header">
                 <h2>Electronics</h2>
                </div>
                <div class="card-body">
                    <div class="b-row-1">
                       <div class="img-1">
                        <img src="../images/airconditioners.jpg"> <br>AIR CONDITIONER
                       </div>
                       <div class="img-1">
                        <img src="../images/refrigeretore.jpg"><br>REFRIGERATOR
                       </div>
                    </div>
                    <div class="b-row-2">
                       <div class="img-1">
                        <img src="../images/washing machine.jpg"><br>WASHING MECHINE
                       </div>
                       <div class="img-1">
                        <img src="../images/microwaves.jpg"><br>FOOD HEATER
                       </div>
                    </div>

                </div>
                <div class="card-footer">
                    <a href="#">see details...</a>
                </div>
              </div>
               <div class="card-2">
                <div class="card-header">
                 <h2>Bluetooths</h2>
                </div>
                <div class="card-body">
                    <div class="b-row-3">
                       <div class="img-1">
                        <img src="../images/buds.jpg" width="150px" height="150px"> <br>BUDS
                       </div>
                       <div class="img-1">
                        <img src="../images/headph.jpg" width="150px" height="150px"><br>HEAD PHONES
                       </div>
                    </div>
                    <div class="b-row-4">
                       <div class="img-1">
                        <img src="../images/neak band.jpg" width="150px" height="150px"><br>NECK BANDS
                       </div>
                       <div class="img-1">
                        <img src="../images/neakband2.jpg" width="150px" height="150px"><br>BRAND NECK BANDS
                       </div>
                    </div>

                </div>
                <div class="card-footer">
                    <a href="#">see details...</a>
                </div>
              </div>
               <div class="card-3">
                <div class="card-header">
                 <h2>Electronics</h2>
                </div>
                <div class="card-body">
                    <div class="b-row-1">
                       <div class="img-1">
                        <img src="../images/airconditioners.jpg"> <br>AIR CONDITIONER
                       </div>
                       <div class="img-1">
                        <img src="../images/refrigeretore.jpg"><br>REFRIGERATOR
                       </div>
                    </div>
                    <div class="b-row-2">
                       <div class="img-1">
                        <img src="../images/washing machine.jpg"><br>WASHING MECHINE
                       </div>
                       <div class="img-1">
                        <img src="../images/microwaves.jpg"><br>FOOD HEATER
                       </div>
                    </div>

                </div>
                <div class="card-footer">
                    <a href="#">see details...</a>
                </div>
              </div>
          </div>
        </div>
    </div>
</body>
</html>
