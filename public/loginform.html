<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #4326d3, #c093ca);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 250px;
            background-color: white;
            padding: 24px 20px 20px;
            border-radius: 4px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        }

        .login-container h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 17px;
            color: #111;
        }

        .social-buttons {
            display: flex;
            gap: 7px;
            margin-bottom: 16px;
        }

        .social-buttons button {
            width: 50%;
            height: 31px;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 13px;
            cursor: pointer;
        }

        .facebook {
            background-color: #4267a9;
        }

        .twitter {
            background-color: #1da1e2;
        }

        .social-buttons i {
            margin-right: 6px;
        }

        /* Input fields */
        .input-box {
            position: relative;
            margin-bottom: 10px;
        }

        .input-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 12px;
        }

        .input-box input {
            width: 100%;
            height: 34px;
            padding: 0 10px 0 32px;
            border: 1px solid #ddd;
            border-radius: 3px;
            outline: none;
            font-size: 12px;
        }

        .input-box input:focus {
            border-color: #c026d3;
        }

        .input-box input::placeholder {
            color: #888;
        }

       
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 11px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #555;
        }

        .remember input {
            width: 10px;
            height: 10px;
        }

        .forgot {
            color: #c026d3;
            text-decoration: none;
        }

      
        .login-btn {
            width: 100%;
            height: 34px;
            background-color: #c026d3;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 13px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #a91fc0;
        }

  
        .signup {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #333;
        }

        .signup a {
            color: #c026d3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <form method="get">

    <div class="login-container">

        <h2>Login Form</h2>

        <div class="social-buttons">
            <button class="facebook">
                <i class="fa-brands fa-facebook-f"></i>
                Facebook
            </button>

            <button class="twitter">
                <i class="fa-brands fa-twitter"></i>
                Twitter
            </button>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Email or Phone">
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password">
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>

            <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button class="login-btn">Login</button>

        <div class="signup">
            Not a member?
            <a href="#">Signup now</a>
        </div>

    </div>
    </form>

</body>
</html>
