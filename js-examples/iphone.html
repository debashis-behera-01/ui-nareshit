<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
</head>
<script>
   var iphone ={
    title:"Apple iPhone 18(Burgundy,256 GB)",
    price:189000,
    image:"../images/iphone18.png",
    rating:{
        rate:4.8,
        ratings:14000,
        reviews:5000
    },
    features:[
        "256 GB ROM",
        "15.9 cm(6.1 inch) Super Retina XDR Display",
        "48MP + 12MP | 12MP Front Camera",
        "A16 Bionic Chip, 6 Core Processor Processor",
        "1 year warranty for phone and 1 year warranty for in Box Accessories"
    ]
   }
   function bodyLoad(){
    document.getElementById("imgProduct").src=iphone.image;
    document.getElementById("lblTitle").textContent=iphone.title;
    document.getElementById("lblRating").innerHTML=`<span class="bg-success rounded fs-6 text-white p-2">${iphone.rating.rate}<span class="bi bi-star-fill"></span></span> 
    <span class="text-secondary fs-6 fw-bold mx-2">${iphone.rating.ratings.toLocaleString('en-in')} ratings & ${iphone.rating.reviews.toLocaleString('en-in')} reviwes</span>`;
     
    iphone.features.map(function(feature){
        var li=document.createElement("li");
        li.textContent = feature;
         li.className = "my-3" 
         document.getElementById("lblFeature").appendChild(li);
    })
    document.getElementById("lblPrice").innerHTML=iphone.price.toLocaleString('en-in',{style:'currency',currency:"INR",minimumFractionDigits:0,maximumFractionDigits:0});
   }
</script>
<body class="container-fluid" onload="bodyLoad()">
    <div class="row mt-4">
        <div class="col-3">
              <img id="imgProduct" width="100%">
        </div>
        <div class="col-6">
            <div id="lblTitle" class="fs-5 fw-bold"></div>
            <div id="lblRating" class="mt-3"></div>
            <div id="lblFeature" class="mt-3 text-secondary" style="margin-left: 20px;"></div>
        </div>
        <div class="col-3">
            <div id="lblPrice" class="fs-1 fw-bold"></div>
        </div>
    </div>
</body>
</html>
