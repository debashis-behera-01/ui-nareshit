<script>
    try{
         var a=parseInt(prompt("enter number a"));
         var b=parseInt(prompt("enter number b"));
         if(b===0){
            throw "cant Divide by zero";
         }
         if(b>a){
            throw "cant divide by a larger number";
         }
         var c=a/b;
         document.write("Divison="+c+"<br>");
    }
    catch(error){
        document.write(error +"<br>");
    }
    finally{
        document.write("Program End");
    }
</script>
