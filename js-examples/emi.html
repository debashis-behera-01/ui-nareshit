<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI CALCULATER</title>
     <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../src/script/emi.js"></script>
</head>
<body class="container-fluid bg-secondary p-2">
    <div class="row m-4">
        <div class="col" style="height: 300px;">
            <div class="card p-3">
                <div class="d-flex justify-content-between">
                    <div class="fw-bold">Loan Amount</div>
                    <div>
                        <input type="text" id="txtAmount" onchange="amountChange()"  min="100000" max="1000000" value="100000" step="10000">
                    </div>
                </div>
                <div class="mt-4">
                    <input type="range" onchange="handleAmountChange()" id="rangeAmount" min="100000" max="1000000" value="100000" step="10000" class="form-range">
                    <div>
                        <span>&#8377;1,00,000/-</span>
                        <span class="float-end">&#8377;10,00,000/-</span>
                    </div>       
                </div>

                 <div class="d-flex justify-content-between mt-4">
                    <div class="fw-bold">Loan Tenure</div>
                    <div>
                        <input type="text" id="txtYears" size="2" onchange="Yearchange()" min="1" max="5" value="1" step="1">
                    </div>
                </div>
                <div class="mt-2">
                    <input type="range" onchange="handleYearChange()" id="rangeYears" min="1" max="5" value="1" step="1" class="form-range">
                    <div>
                        <span>1 Year</span>
                        <span class="float-end">5 Years</span>
                    </div>       
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <div class="fw-bold">Interest Rate</div>
                    <div>
                        <input type="text" id="txtRate" size="2" onchange="Ratechange()" min="10.45" max="19.45" value="10.45" step="0.01">
                    </div>
                </div>
                <div class="mt-2">
                    <input type="range" onchange="handleRateChange()" id="rangeRate" min="10.45" max="19.45" value="10.45" step="0.01" class="form-range">
                    <div>
                        <span>10.45%</span>
                        <span class="float-end">19.45%</span>
                    </div>       
                </div>
                <div class="mt-4">
                    <button onclick="CalculateClick()" class="btn btn-primary w-100">Calculate</button>
                </div>
            </div>
        </div>
        <div class="col" style="height: 300px;">
            <div class="card p-3">
                <div class="card-header">
                    <h3>Your Montly EMI</h3>
                </div>
                <div class="card-body">
                    <h1 id="lblResult"></h1>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
