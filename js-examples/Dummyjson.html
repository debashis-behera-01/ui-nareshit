<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script>
        function bodyLoad(){
            fetch(`https://dummyjson.com/products`)
            .then(function(response){
                return response.json();
            })
            .then(function(object){
                object.products.map(function(product){

                      var tr = document.createElement("tr");
                      var tdTitle = document.createElement("td");
                      var tdPreview = document.createElement("td");
                      var tdPrice = document.createElement("td");
                      var tdCategory = document.createElement("td");
                      var tdActions = document.createElement("td");

                      tdTitle.innerHTML=product.title;
                      tdPreview.innerHTML=`<img width="50" src=${product.thumbnail}>`;
                      tdPrice.innerHTML=product.price;
                      tdCategory.innerHTML=product.category;
                      tdActions.innerHTML=`<button class="btn btn-warning bi bi-pen-fill"></button>
                         <button class="btn btn-danger bi bi-trash-fill mx-2"></button>`;


                         tr.appendChild(tdTitle);
                         tr.appendChild(tdPreview);
                         tr.appendChild(tdPrice);
                         tr.appendChild(tdCategory);
                         tr.appendChild(tdActions);

                         document.querySelector("tbody").appendChild(tr);
            })
        })
        }
    </script>
</head>
<body class="container-fluid" onload="bodyLoad()">
    <table class="table table-hover">
        <caption>Dummy JSON Products</caption>
        <thead>
            <tr>
                <th width="300">Title</th>
                 <th>Preview</th>
                 <th>Price</th>
                 <th>Category</th>
                 <th>Actions</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    
</body>
</html>
