<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../src/script/bmi.js"></script>
</head>
<body class="container-fluid">
    <div class="row m-4">
        <div class="col" style="height: 300px;">
            <div class="card">
                <div class="card-header bg-warning-subtle">
                    <h1 class="fw-bold">BMI CALCULATOR</h1>
                </div>
                <div class="card-body bg-body-secondary">
                    
                <div class="mt-2">
                    <span class="fw-bold me-2"><label for="age">Age</label></span>
                    <span><input type="text" id="txtAge" name="age"></span>
                    <span class="ms-3">ages:2-120</span>
                </div>
                 <div class="mt-2">
                    <span class="fw-bold me-2">Gender</span>
                    <span><input type="radio" id="rdomale" name="gender"><label for="gender">Male</label></span>
                    <span><input type="radio" id="rdofemale" name="gender"><label for="gender">Female</label></span>
                </div>
                <div class="mt-2 d-flex">
                    <span class="fw-bold me-2"><label for="height">Height</label></span>
                    <div class="position-relative">
                         <input type="text" id="txtHeight" name="height">
                         <div class="position-absolute top-0 end-0 pe-1">m</div>
                    </div>
                </div>
                <div class="mt-2 d-flex">
                    <span class="fw-bold me-2"><label for="weight">Weight</label></span>
                   <div class="position-relative">
                     <input type="text" id="txtWeight" name="weight">
                    <div class="position-absolute top-0 end-0 pe-1" >kg</div>
                   </div>
                
                </div>
                </div>

                <div class="card-footer d-flex justify-content-between  bg-danger-subtle">
                    <button class="btn btn-success w-100" onclick="Calculate()">Calculate<span class="bi bi-play-circle ms-1"></span></button>
                </div>
            </div>
        </div>


        
        <div class="col" style="height: 300px;">
            <div class="card">
               <div class="card-header d-flex justify-content-center bg-success">
                <h3>Result</h3>
               </div>
               <div class="card-body d-flex justify-content-between bg-primary-subtle">
                   <span><h1>BMI=</h1></span><h1 id="Result"></h1> <h1> kg/m<sup>2</sup></h1>
               </div>
            </div>
        </div>
    </div>
    
</body>
</html>
