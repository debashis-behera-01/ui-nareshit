<script>
     var age = parseInt(prompt("Enter Age"));
    if(isNaN(age)){
        alert("Age must be a number");
    }
    else if((typeof age)==="number"){
        document.write("Age is " + (typeof age)+"."+ "<br>");
        
        document.write("Next year your age is "+(age+1)+".");
    }else{
        alert("Age must be a number");
    }
</script>
